<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="../style/reset.css" />
    <link rel="stylesheet" href="../style/landing.css" />
    <link rel="stylesheet" href="../style/landing.tablet.css" />
    <link rel="stylesheet" href="../style/landing.mobile.css" />
    <link
      rel="preload"
      href="../assets/fonts/JejuGothic-Regular.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="preload"
      href="../assets/fonts/NoveliaPro.ttf"
      as="font"
      type="font/ttf"
      crossorigin
    />
    <link
      rel="icon"
      type="image/ico"
      href="../assets/images/detetive-marlene-icon.ico"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@500;600&display=swap"
      rel="stylesheet"
    />
    <title>Marlene do Asfalto</title>
  </head>

  <body>
    <header>
      <nav>
        <ul class="nav_link-container">
          <li><a href="/" class="nav-links">Home</a></li>
          <li><a href="/download/" class="nav-links">Download</a></li>
          <li><a href="#JOGUEASFALTO" class="nav-links">Jogue asfalto</a></li>
        </ul>
      </nav>
    </header>

    <main>
      <section id="OJOGO">
        <img
          src="../assets/images/logo-asfalto.webp"
          alt="Letras estilizadas envoltas em luz neon formam o nome Asfalto, cortado ao meio por uma bengala na horizontal."
        />
      </section>
      <section id="JOGUEASFALTO">
        <h2>Jogue asfalto!</h2>
        <ul id="GAMEVERSIONS">
          <li>
            <div
              id="unity-container"
              class="unity-desktop"
              aria-labelledby="descricaoTitulo"
            >
              <h2 id="descricaoTitulo" class="visually-hidden">
                audio jogo Asfalto
              </h2>

              <div id="loading-bar">
                <img
                  src="../assets/load.svg"
                  alt="Ícone de carregamento giratório composto por 12 elipses que formam um círculo. As elipses variam em tons de cinza, indo do mais claro ao mais escuro no sentido horário, criando um efeito de movimento circular contínuo."
                  width="40"
                  height="40"
                />
                <p>Carregando... Aguarde um momento para iniciar o jogo.</p>
                <p>Para jogar, você precisará de um leitor de tela como</p>
                <p>NVDA ou JAWS instalado e configurado.</p>
                <button id="closeLoad" onclick="closeLoad()">Fechar</button>
              </div>

              <canvas
                id="unity-canvas"
                width="960"
                height="540"
                tabindex="-1"
              ></canvas>
              <div id="unity-loading-bar">
                <div id="unity-logo"></div>
                <div id="unity-progress-bar-empty">
                  <div id="unity-progress-bar-full"></div>
                </div>
              </div>
              <div id="unity-warning"></div>
              <div id="unity-footer">
                <div id="unity-webgl-logo"></div>
                <div id="unity-fullscreen-button"></div>
              </div>
            </div>
          </li>
        </ul>
      </section>
    </main>

    <footer>
      <div class="container-divider">
        <div class="img-wrapper">
          <img
            src="../assets/images/gov-logos.png"
            id="gov-images"
            alt="Logos do PROAC - Programa de Ação Cultura e Governo do Estado de São Paulo - Secretária de Cultura e Economia Criativa"
          />
        </div>
      </div>
    </footer>
    <script>
      const setupUnity = () => {
        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector(
          "#unity-progress-bar-full"
        );
        var fullscreenButton = document.querySelector(
          "#unity-fullscreen-button"
        );
        var warningBanner = document.querySelector("#unity-warning");

        function unityShowBanner(msg, type) {
          function updateBannerVisibility() {
            warningBanner.style.display = warningBanner.children.length
              ? "block"
              : "none";
          }
          var div = document.createElement("div");
          div.innerHTML = msg;
          warningBanner.appendChild(div);
          if (type === "error") div.style = "background: red; padding: 10px;";
          else {
            if (type === "warning")
              div.style = "background: yellow; padding: 10px;";
            setTimeout(() => {
              warningBanner.removeChild(div);
              updateBannerVisibility();
            }, 5000);
          }
          updateBannerVisibility();
        }

        var buildUrl = "../Build"; // URL base
        var loaderUrl = buildUrl + "/Asfalto-1.0.2-WebGl.loader.js";

        var config = {
          dataUrl: buildUrl + "/Asfalto-1.0.2-WebGl.data",
          frameworkUrl: buildUrl + "/Asfalto-1.0.2-WebGl.framework.js",
          codeUrl: buildUrl + "/Asfalto-1.0.2-WebGl.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "Sylvana Machado",
          productName: "Asfalto",
          productVersion: "1.0.2",
          showBanner: unityShowBanner,
        };

        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
          var meta = document.createElement("meta");
          meta.name = "viewport";
          meta.content =
            "width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes";
          document.getElementsByTagName("head")[0].appendChild(meta);
          container.className = "unity-mobile";
          canvas.className = "unity-mobile";
        } else {
          canvas.style.width = "960px";
          canvas.style.height = "600px";
        }

        loadingBar.style.display = "block";

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
          createUnityInstance(canvas, config, (progress) => {
            progressBarFull.style.width = 100 * progress + "%";
          })
            .then((unityInstance) => {
              loadingBar.style.display = "none";
              fullscreenButton.onclick = () => {
                unityInstance.SetFullscreen(1);
              };
            })
            .catch((message) => {
              alert(message);
            });
        };

        document.body.appendChild(script);
      };

      const initializeUnity = async () => {
        setupUnity();
      };
      initializeUnity();

      const closeLoad = () => {
        const loadingBar = document.querySelector("#loading-bar");
        loadingBar.style.display = "none";
      };
    </script>
  </body>
</html>
